<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shadow Root Frame</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0.5em; }
  </style>
</head>
<body>
  <button id="frame-button" type="button">Click me</button>
  <span id="click-count">Clicked 0 times</span>

  <h4>Closed Shadow Root inside iframe</h4>
  <div id="inner-closed-host"></div>

  <script src="controls.js"></script>
  <script>
    (function () {
      let clicks = 0;
      document.getElementById('frame-button').addEventListener('click', () => {
        clicks++;
        document.getElementById('click-count').textContent = `Clicked ${clicks} times`;
      });

      addControls(attachShadowTo('inner-closed-host', 'closed'));
    })();
  </script>
</body>
</html>
