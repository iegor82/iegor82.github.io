<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow Root</title>
</head>
<body>
  <h3>Open Shadow Root</h3>
  <div id="open-host"></div>

  <h3>Closed Shadow Root</h3>
  <div id="closed-host"></div>

  <script>
    (function() {
      function addControls(shadow) {
        shadow.append(document.createElement('textarea'));
        shadow.append(document.createElement('br'));

        const select = document.createElement('select');

        const opt1 = document.createElement('option');
        opt1.text = opt1.value = 'Option 1';
        const opt2 = document.createElement('option');
        opt2.text = opt2.value = 'Option 2';
        const opt3 = document.createElement('option');
        opt3.text = opt3.value = 'Option 3';

        select.add(opt1);
        select.add(opt2);
        select.add(opt3);

        shadow.append(select);
      }

      const openShadow = document.getElementById('open-host').attachShadow({ mode: 'open' });
      addControls(openShadow);

      const closedShadow = document.getElementById('closed-host').attachShadow({ mode: 'closed' });
      addControls(closedShadow);
    })();
  </script>
</body>
</html>
