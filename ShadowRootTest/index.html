<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shadow Root</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 1em; }
  </style>
</head>
<body>
  <h3>1. Open Shadow Root</h3>
  <div id="open-host"></div>

  <h3>2. Closed Shadow Root</h3>
  <div id="closed-host"></div>

  <h3>3. Closed Shadow Root &rarr; iframe &rarr; button + Closed Shadow Root</h3>
  <div id="closed-frame-host"></div>

  <script src="controls.js"></script>
  <script>
    (function () {
      addControls(attachShadowTo('open-host', 'open'));
      addControls(attachShadowTo('closed-host', 'closed'));

      const iframe = document.createElement('iframe');
      iframe.src = 'frame.html';
      iframe.title = 'Frame with a button and a closed shadow root';
      iframe.style.cssText = 'width: 400px; height: 200px; border: 1px solid #999;';
      attachShadowTo('closed-frame-host', 'closed').append(iframe);
    })();
  </script>
</body>
</html>
